<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Kevin, mein Goldschatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold: #ffd76a;
    --pink: #ff6fa5;
    --violet: #8a4fff;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#05010a;
    font-family:'Cinzel', serif;
  }
  #sky{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(138,79,255,0.35), transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(255,111,165,0.30), transparent 60%),
      radial-gradient(ellipse at 50% 50%, rgba(255,215,106,0.15), transparent 70%),
      #05010a;
    background-size: 200% 200%;
    animation: nebula 14s ease-in-out infinite;
  }
  @keyframes nebula{
    0%{ background-position: 0% 0%; filter:hue-rotate(0deg); }
    50%{ background-position: 100% 100%; filter:hue-rotate(25deg); }
    100%{ background-position: 0% 0%; filter:hue-rotate(0deg); }
  }
  canvas#stars{ position:fixed; inset:0; z-index:1; }

  /* ---------- Backroom idol dancers (kawaii chibi, Caramelldansen hop) ---------- */
  .backroom{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    overflow:hidden;
  }
  .dancer{
    position:absolute;
    bottom:2%;
    width:110px;
    animation: carameldance 1s ease-in-out infinite;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
  }
  @keyframes carameldance{
    0%,100%{ transform: translate(-16px,0) rotate(-4deg); }
    25%{     transform: translate(-16px,-18px) rotate(-1deg); }
    50%{     transform: translate(16px,0) rotate(4deg); }
    75%{     transform: translate(16px,-18px) rotate(1deg); }
  }
  .dancer svg{ width:100%; height:auto; display:block; overflow:visible; }
  .dancer .tail-l, .dancer .tail-r{
    transform-box: fill-box; transform-origin: 50% 0%;
    animation: tailSway 1s ease-in-out infinite;
  }
  .dancer .tail-r{ animation-delay: 0.5s; }
  @keyframes tailSway{
    0%,100%{ transform: rotate(-12deg); }
    50%{ transform: rotate(12deg); }
  }
  .dancer .arm-l, .dancer .arm-r{
    transform-box: fill-box; transform-origin: 50% 0%;
    animation: armSwingC 1s ease-in-out infinite;
  }
  .dancer .arm-r{ animation-delay: 0.15s; }
  @keyframes armSwingC{
    0%,100%{ transform: rotate(18deg); }
    50%{ transform: rotate(-22deg); }
  }
  .dancer .leg-l, .dancer .leg-r{
    transform-box: fill-box; transform-origin: 50% 0%;
    animation: legHop 1s ease-in-out infinite;
  }
  @keyframes legHop{
    0%,100%{ transform: scaleY(1); }
    50%{ transform: scaleY(0.82); }
  }
  .dancer .eye-sparkle{ animation: eyeTwinkle 2.6s ease-in-out infinite; }
  @keyframes eyeTwinkle{
    0%,85%,100%{ opacity:1; }
    90%{ opacity:0.15; }
  }

  .hearts-layer{ position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
  .heart{
    position:absolute;
    bottom:-10vh;
    font-size:24px;
    opacity:0.9;
    filter: drop-shadow(0 0 6px rgba(255,120,170,0.8));
    animation: rise linear forwards;
    will-change: transform, opacity;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0) rotate(0deg) scale(0.6); opacity:0; }
    10%{ opacity:1; }
    100%{ transform: translateY(-115vh) translateX(var(--drift)) rotate(var(--spin)); opacity:0; }
  }

  .stage{
    position:relative; z-index:5;
    height:100%; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff5e6;
    padding:24px;
  }

  .center-heart{
    font-size: clamp(70px, 14vw, 150px);
    line-height:1;
    filter: drop-shadow(0 0 25px rgba(255,90,150,0.9)) drop-shadow(0 0 55px rgba(140,80,255,0.6));
    animation: pulse 1.8s ease-in-out infinite, split 6s ease-in-out infinite;
    margin-bottom: 8px;
  }
  @keyframes pulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.12); }
  }
  @keyframes split{
    0%,80%,100%{ text-shadow: 0 0 0 transparent; }
    85%{ text-shadow: -14px 0 18px rgba(255,111,165,0.85), 14px 0 18px rgba(138,79,255,0.85); }
    90%{ text-shadow: -6px 0 10px rgba(255,111,165,0.6), 6px 0 10px rgba(138,79,255,0.6); }
  }

  h1{
    font-family:'Great Vibes', cursive;
    font-weight:400;
    font-size: clamp(48px, 9vw, 96px);
    margin: 0 0 6px 0;
    background: linear-gradient(90deg, var(--gold), var(--pink), var(--violet), var(--gold));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
    text-shadow: 0 0 40px rgba(255,215,106,0.35);
  }
  @keyframes shimmer{
    0%{ background-position: 0% 50%; }
    100%{ background-position: 300% 50%; }
  }
  p.sub{
    font-size: clamp(16px, 2.4vw, 22px);
    letter-spacing: 2px;
    color: #ffe9c7;
    text-transform: uppercase;
    opacity:0.9;
    margin: 0 0 34px 0;
  }

  button#play{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size: 17px;
    letter-spacing:1px;
    padding: 14px 34px;
    border-radius: 999px;
    border: 1px solid rgba(255,215,106,0.6);
    background: linear-gradient(135deg, rgba(255,111,165,0.25), rgba(138,79,255,0.25));
    color: #fff5e6;
    cursor:pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 30px rgba(255,111,165,0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  button#play:hover{ transform: translateY(-2px) scale(1.03); box-shadow: 0 0 45px rgba(255,215,106,0.45); }
  button#play:active{ transform: translateY(0) scale(0.98); }

  .flash{
    position:fixed; inset:0; z-index:6; pointer-events:none;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.9), rgba(255,200,230,0.4) 40%, transparent 70%);
    opacity:0;
  }
  .flash.go{ animation: supernova 0.9s ease-out; }
  @keyframes supernova{
    0%{ opacity:0; transform: scale(0.3); }
    30%{ opacity:0.95; transform: scale(1.3); }
    100%{ opacity:0; transform: scale(2.2); }
  }

  .vignette{
    position:fixed; inset:0; z-index:4.5; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.75) 100%);
  }
</style>
</head>
<body>

<div id="sky"></div>
<canvas id="stars"></canvas>
<div class="backroom" id="backroom"></div>
<div class="hearts-layer" id="heartsLayer"></div>
<div class="vignette"></div>
<div class="flash" id="flash"></div>

<div class="stage">
  <div class="center-heart">💛</div>
  <h1>Kevin</h1>
  <p class="sub">mein Goldschatz</p>
  <button id="play">▶ Lied abspielen</button>
</div>

<script>
// ---------- Backroom idol dancers: kawaii chibi girls, Caramelldansen hop ----------
// Original flat-vector chibi character (not a copy of any existing show/franchise art),
// just recolored per dancer for a cute idol-group palette.
function chibiSVG(hair, dress, shoe, eye){
  return `
  <svg viewBox="0 0 120 190" xmlns="http://www.w3.org/2000/svg">
    <g class="tail-l"><path d="M40 20 C10 30,5 90,20 140 C26 120,34 90,34 60 C34 45,38 30,40 20 Z" fill="${hair}"/></g>
    <g class="tail-r"><path d="M80 20 C110 30,115 90,100 140 C94 120,86 90,86 60 C86 45,82 30,80 20 Z" fill="${hair}"/></g>

    <circle cx="60" cy="48" r="30" fill="#ffe3c7"/>
    <path d="M30 45 Q60 5 90 45 Q78 28 60 32 Q42 28 30 45 Z" fill="${hair}"/>

    <path d="M34 30 L26 6 L50 22 Z" fill="${hair}"/>
    <path d="M36 25 L33 14 L44 22 Z" fill="#ffd7e6"/>
    <path d="M86 30 L94 6 L70 22 Z" fill="${hair}"/>
    <path d="M84 25 L87 14 L76 22 Z" fill="#ffd7e6"/>

    <ellipse cx="46" cy="52" rx="8.5" ry="11" fill="#fff"/>
    <ellipse cx="74" cy="52" rx="8.5" ry="11" fill="#fff"/>
    <circle cx="46" cy="54" r="6.5" fill="${eye}"/>
    <circle cx="74" cy="54" r="6.5" fill="${eye}"/>
    <circle cx="46" cy="56" r="2.6" fill="#241a1a"/>
    <circle cx="74" cy="56" r="2.6" fill="#241a1a"/>
    <circle class="eye-sparkle" cx="43.5" cy="49" r="2" fill="#fff"/>
    <circle class="eye-sparkle" cx="71.5" cy="49" r="2" fill="#fff"/>
    <path d="M55 66 Q60 70 65 66" stroke="#a5674f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="39" cy="61" rx="5.5" ry="3.2" fill="#ff9fc0" opacity="0.75"/>
    <ellipse cx="81" cy="61" rx="5.5" ry="3.2" fill="#ff9fc0" opacity="0.75"/>

    <path d="M40 80 Q60 70 80 80 L92 132 Q60 148 28 132 Z" fill="${dress}"/>
    <circle cx="38" cy="83" r="8" fill="${dress}"/>
    <circle cx="82" cy="83" r="8" fill="${dress}"/>
    <path d="M53 78 L60 86 L67 78 L60 82 Z" fill="#fff" opacity="0.9"/>

    <g class="arm-l"><rect x="26" y="85" width="10" height="42" rx="5" fill="#ffe3c7"/><circle cx="31" cy="129" r="6" fill="#ffe3c7"/></g>
    <g class="arm-r"><rect x="84" y="85" width="10" height="42" rx="5" fill="#ffe3c7"/><circle cx="89" cy="129" r="6" fill="#ffe3c7"/></g>

    <g class="leg-l"><rect x="44" y="128" width="11" height="38" rx="5" fill="#ffe3c7"/></g>
    <g class="leg-r"><rect x="65" y="128" width="11" height="38" rx="5" fill="#ffe3c7"/></g>
    <rect x="40" y="162" width="19" height="11" rx="5.5" fill="${shoe}"/>
    <rect x="61" y="162" width="19" height="11" rx="5.5" fill="${shoe}"/>
  </svg>`;
}

const palettes = [
  { hair:'#5fe0c7', dress:'#ff8fb3', shoe:'#ffffff', eye:'#1f8f7d' },
  { hair:'#ff9fd0', dress:'#b28dff', shoe:'#ffffff', eye:'#b03d7a' },
  { hair:'#c6a0ff', dress:'#8bf0c9', shoe:'#ffffff', eye:'#6b3fae' },
  { hair:'#ffc9a0', dress:'#8fd0ff', shoe:'#ffffff', eye:'#c97a3d' },
  { hair:'#9dffc9', dress:'#ffe27a', shoe:'#ffffff', eye:'#2e9e5b' }
];

const backroom = document.getElementById('backroom');
const dancerCount = palettes.length;
for(let i=0;i<dancerCount;i++){
  const d = document.createElement('div');
  d.className = 'dancer';
  const left = 6 + (i * (82/(dancerCount-1)));
  const scale = 0.8 + Math.random()*0.35;
  const p = palettes[i];
  d.style.left = left + '%';
  d.style.setProperty('--s', scale);
  d.style.width = (110*scale) + 'px';
  d.style.animationDelay = (i*0.06).toFixed(2) + 's';
  d.innerHTML = chibiSVG(p.hair, p.dress, p.shoe, p.eye);
  backroom.appendChild(d);
}

// ---------- Starfield ----------
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  stars = Array.from({length: 160}, () => ({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*1.6 + 0.3,
    phase: Math.random()*Math.PI*2,
    speed: Math.random()*0.02 + 0.01
  }));
}
window.addEventListener('resize', resize);
resize();
function drawStars(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const s of stars){
    const tw = 0.5 + 0.5*Math.sin(t*s.speed + s.phase);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,240,220,${0.3 + tw*0.7})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

// ---------- Floating hearts ----------
const heartsLayer = document.getElementById('heartsLayer');
const heartEmojis = ['💛','💖','💗','❤️','✨','💫','🎵','🎶','⭐'];
let heartRate = 420;
function spawnHeart(){
  const el = document.createElement('div');
  el.className = 'heart';
  el.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
  const left = Math.random()*100;
  const size = 16 + Math.random()*34;
  const duration = 6 + Math.random()*6;
  const drift = (Math.random()*2 - 1) * 120;
  const spin = (Math.random()*2 - 1) * 60;
  el.style.left = left + 'vw';
  el.style.fontSize = size + 'px';
  el.style.animationDuration = duration + 's';
  el.style.setProperty('--drift', drift + 'px');
  el.style.setProperty('--spin', spin + 'deg');
  heartsLayer.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}
let spawnTimer = setInterval(spawnHeart, heartRate);

function burstHearts(n){
  for(let i=0;i<n;i++) setTimeout(spawnHeart, i*30);
}

// ---------- Audio: cinematic music-box melody ----------
let audioCtx = null;
let musicTimer = null;
let playing = false;

const melody = [
  523.25, 659.25, 783.99, 1046.5, 783.99, 659.25, 523.25, 659.25,
  587.33, 698.46, 880.00, 698.46, 587.33, 493.88, 587.33, 698.46
]; // simple cheerful arpeggio, no copyrighted material
let noteIndex = 0;

function playNote(freq, time, dur, gainPeak){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, time);
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(gainPeak, time + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + dur + 0.05);

  // soft bass shadow an octave down
  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(freq/2, time);
  gain2.gain.setValueAtTime(0, time);
  gain2.gain.linearRampToValueAtTime(gainPeak*0.25, time + 0.03);
  gain2.gain.exponentialRampToValueAtTime(0.001, time + dur*1.4);
  osc2.connect(gain2).connect(audioCtx.destination);
  osc2.start(time);
  osc2.stop(time + dur*1.4 + 0.05);
}

function scheduleMelody(){
  const now = audioCtx.currentTime;
  const noteDur = 0.42;
  for(let i=0;i<4;i++){
    playNote(melody[noteIndex % melody.length], now + i*noteDur, noteDur*0.95, 0.18);
    noteIndex++;
  }
  musicTimer = setTimeout(scheduleMelody, noteDur*4*1000);
}

// ---------- Speech: "Ouh Yeah Kevin, du bist mein Goldschatz" + high pitched supernova line ----------
let speechTimer = null;
function pickGermanVoice(){
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang && v.lang.startsWith('de')) || voices[0] || null;
}

function sayLine(text, pitch, rate, volume){
  const u = new SpeechSynthesisUtterance(text);
  const v = pickGermanVoice();
  if(v) u.voice = v;
  u.lang = 'de-DE';
  u.pitch = pitch;
  u.rate = rate;
  u.volume = volume;
  speechSynthesis.speak(u);
  return u;
}

function speechCycle(){
  sayLine('Ouh yeah, Kevin, du bist mein Goldschatz!', 1.1, 0.95, 1.0);

  setTimeout(() => {
    document.getElementById('flash').classList.remove('go');
    void document.getElementById('flash').offsetWidth; // restart animation
    document.getElementById('flash').classList.add('go');
    burstHearts(18);
    sayLine('Uuuuh uuuh, super nova!', 2.0, 1.35, 0.9);
  }, 2400);

  speechTimer = setTimeout(speechCycle, 6200);
}

// ---------- Controls ----------
const btn = document.getElementById('play');
function start(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  noteIndex = 0;
  scheduleMelody();
  speechCycle();
  clearInterval(spawnTimer);
  heartRate = 220;
  spawnTimer = setInterval(spawnHeart, heartRate);
  playing = true;
  btn.textContent = '⏸ Pausieren';
}
function stop(){
  if(musicTimer) clearTimeout(musicTimer);
  if(speechTimer) clearTimeout(speechTimer);
  speechSynthesis.cancel();
  clearInterval(spawnTimer);
  heartRate = 420;
  spawnTimer = setInterval(spawnHeart, heartRate);
  playing = false;
  btn.textContent = '▶ Lied abspielen';
}
btn.addEventListener('click', () => playing ? stop() : start());

if(speechSynthesis.onvoiceschanged !== undefined){
  speechSynthesis.onvoiceschanged = () => {};
}
</script>
</body>
</html>
