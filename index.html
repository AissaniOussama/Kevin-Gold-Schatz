<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Kevin, mein Goldschatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple: #8b6cf2;
    --pink: #ff6fa8;
    --ink: #4a3b63;
    --bg1: #f4ecff;
    --bg2: #ffe7f3;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%; height:100%;
    overflow:hidden;
    font-family:'Quicksand', sans-serif;
    color: var(--ink);
  }
  body{
    background: linear-gradient(135deg, var(--bg1) 0%, #fdeeff 45%, var(--bg2) 100%);
  }

  #grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(139,108,242,0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,108,242,0.09) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 40%, #000 55%, transparent 100%);
  }
  .blob{
    position:fixed; z-index:0; pointer-events:none;
    border-radius:50%; filter: blur(70px); opacity:0.55;
  }
  .blob.b1{ width:420px; height:420px; left:-100px; top:-80px; background:#d9c4ff; }
  .blob.b2{ width:380px; height:380px; right:-120px; bottom:-100px; background:#ffc9e3; }
  .blob.b3{ width:300px; height:300px; right:15%; top:-60px; background:#ffe6b3; opacity:0.4; }

  .sparkles{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .sparkle{
    position:absolute; user-select:none;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.25; transform: scale(0.8) rotate(0deg); }
    50%{ opacity:1; transform: scale(1.15) rotate(20deg); }
  }

  .hearts-layer{ position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .heart{
    position:absolute;
    bottom:-10vh;
    font-size:22px;
    opacity:0.9;
    filter: drop-shadow(0 2px 4px rgba(255,111,165,0.35));
    animation: rise linear forwards;
    will-change: transform, opacity;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0) rotate(0deg) scale(0.6); opacity:0; }
    10%{ opacity:1; }
    100%{ transform: translateY(-115vh) translateX(var(--drift)) rotate(var(--spin)); opacity:0; }
  }

  .stage{
    position:relative; z-index:3;
    height:100%; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:24px;
    pointer-events:none;
  }

  .hero-heart{ width: clamp(130px, 20vw, 190px); animation: bob 3s ease-in-out infinite; margin-bottom: 4px; }
  @keyframes bob{
    0%,100%{ transform: translateY(0) rotate(-2deg); }
    50%{ transform: translateY(-14px) rotate(2deg); }
  }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(46px, 9vw, 92px);
    margin: 4px 0 0 0;
    line-height:1;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub{
    font-family:'Baloo 2', sans-serif;
    font-size: clamp(16px, 2.6vw, 24px);
    letter-spacing: 1px;
    color: var(--purple);
    opacity:0.9;
    margin: 6px 0 0 0;
  }

  /* ---------- Invisible GIF drop zones clustered around the heart ---------- */
  .gif-board{ position:fixed; inset:0; z-index:5; pointer-events:none; }
  .drop-zone{
    position:absolute;
    width: 190px; height:190px;
    border-radius: 16px;
    background: transparent;
    border: 2px dashed transparent;
    overflow:hidden;
    pointer-events:auto;
    cursor:pointer;
    touch-action:none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .drop-zone.drag-over{ border-color: rgba(255,111,165,0.7); background: rgba(255,255,255,0.35); }
  .drop-zone.has-image{ cursor:grab; }
  .drop-zone.has-image.grabbing{ cursor:grabbing; }
  .drop-zone img{
    width:100%; height:100%; object-fit:cover;
    pointer-events:none; -webkit-user-drag:none;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.22));
  }
  .drop-zone .remove-btn{
    position:absolute; top:-8px; right:-8px;
    width:24px; height:24px; border-radius:50%;
    background:#fff; border:2px solid var(--pink); color:var(--pink);
    font-size:13px; font-weight:700; line-height:1;
    display:none; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0; transition:opacity 0.15s ease;
  }
  .drop-zone.has-image .remove-btn{ display:flex; }
  .drop-zone.has-image:hover .remove-btn{ opacity:1; }
</style>
</head>
<body>

<div id="grid"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>
<div class="sparkles" id="sparkles"></div>
<div class="hearts-layer" id="heartsLayer"></div>

<div class="stage">
  <svg class="hero-heart" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
    <path d="M100,170 C40,120 10,80 10,55 C10,25 33,5 60,5 C80,5 95,16 100,36 C105,16 120,5 140,5 C167,5 190,25 190,55 C190,80 160,120 100,170 Z" fill="#ff8fc0"/>
    <ellipse cx="70" cy="45" rx="26" ry="14" fill="#ffffff" opacity="0.35"/>
    <path d="M62 70 Q70 60 78 70" stroke="#4a3b63" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M122 70 Q130 60 138 70" stroke="#4a3b63" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M92 82 Q100 90 108 82" stroke="#c2437a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="58" cy="80" rx="9" ry="5" fill="#ffb6d5" opacity="0.8"/>
    <ellipse cx="142" cy="80" rx="9" ry="5" fill="#ffb6d5" opacity="0.8"/>
  </svg>
  <h1>Kevin</h1>
  <p class="sub">mein Goldschatz 💜</p>
</div>

<div class="gif-board" id="gifBoard"></div>
<input type="file" id="filePicker" accept="image/*" style="display:none">
<audio id="bgm" src="audio/mein-goldschatz.mp3" loop preload="auto"></audio>

<script>
// ---------- Background music (autoplay if allowed, else on first interaction) ----------
const bgm = document.getElementById('bgm');
bgm.volume = 0.85;
function tryPlayBgm(){
  const p = bgm.play();
  if(p && p.catch) p.catch(() => {
    const resume = () => { bgm.play().catch(()=>{}); cleanup(); };
    const cleanup = () => ['pointerdown','keydown','touchstart'].forEach(evt => window.removeEventListener(evt, resume));
    ['pointerdown','keydown','touchstart'].forEach(evt => window.addEventListener(evt, resume, { once:true }));
  });
}
tryPlayBgm();

// ---------- Decorative sparkle stars ----------
const sparkleLayer = document.getElementById('sparkles');
const sparkleGlyphs = ['✦','✧','⭐','💫'];
const sparkleColors = ['#8b6cf2','#ff6fa8','#ffcf6b','#c7a8ff'];
for(let i=0;i<16;i++){
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.textContent = sparkleGlyphs[Math.floor(Math.random()*sparkleGlyphs.length)];
  s.style.left = Math.random()*100 + 'vw';
  s.style.top = Math.random()*100 + 'vh';
  s.style.fontSize = (10 + Math.random()*18) + 'px';
  s.style.color = sparkleColors[Math.floor(Math.random()*sparkleColors.length)];
  s.style.animationDuration = (2 + Math.random()*3) + 's';
  s.style.animationDelay = (Math.random()*3) + 's';
  sparkleLayer.appendChild(s);
}

// ---------- Floating hearts ----------
const heartsLayer = document.getElementById('heartsLayer');
const heartEmojis = ['💗','💜','✨','⭐','🎀','💫'];
function spawnHeart(){
  const el = document.createElement('div');
  el.className = 'heart';
  el.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
  const left = Math.random()*100;
  const size = 16 + Math.random()*30;
  const duration = 7 + Math.random()*6;
  const drift = (Math.random()*2 - 1) * 120;
  const spin = (Math.random()*2 - 1) * 60;
  el.style.left = left + 'vw';
  el.style.fontSize = size + 'px';
  el.style.animationDuration = duration + 's';
  el.style.setProperty('--drift', drift + 'px');
  el.style.setProperty('--spin', spin + 'deg');
  heartsLayer.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}
setInterval(spawnHeart, 650);

// ---------- 4 invisible GIF drop zones clustered around the heart ----------
const gifBoard = document.getElementById('gifBoard');
const filePicker = document.getElementById('filePicker');
let topZ = 10;
let activeZone = null;

// symmetric 2x2 cluster flanking the heart/title column
const zoneLayout = [
  { left: 'calc(50% - 340px)', top: 'calc(50% - 230px)' },
  { left: 'calc(50% + 150px)', top: 'calc(50% - 230px)' },
  { left: 'calc(50% - 340px)', top: 'calc(50% + 40px)'  },
  { left: 'calc(50% + 150px)', top: 'calc(50% + 40px)'  }
];

function extractImageUrl(dataTransfer){
  const uriList = dataTransfer.getData('text/uri-list') || dataTransfer.getData('text/plain') || dataTransfer.getData('URL');
  if(uriList && /^https?:\/\//i.test(uriList.trim())) return uriList.trim().split('\n')[0];
  const html = dataTransfer.getData('text/html');
  if(html){
    const m = html.match(/<img[^>]+src="([^"]+)"/i);
    if(m) return m[1];
  }
  return null;
}

function setZoneImage(zone, src){
  let img = zone.querySelector('img');
  if(!img){ img = document.createElement('img'); img.alt = 'gif'; zone.insertBefore(img, zone.firstChild); }
  img.src = src;
  zone.classList.add('has-image');
}

function makeDraggable(zone){
  let dragging = false, offsetX = 0, offsetY = 0;
  zone.addEventListener('pointerdown', e => {
    if(!zone.classList.contains('has-image')) return;
    if(e.target.closest('.remove-btn')) return;
    dragging = true;
    zone.setPointerCapture(e.pointerId);
    const rect = zone.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    zone.classList.add('grabbing');
    zone.style.zIndex = ++topZ;
  });
  zone.addEventListener('pointermove', e => {
    if(!dragging) return;
    zone.style.left = (e.clientX - offsetX) + 'px';
    zone.style.top = (e.clientY - offsetY) + 'px';
  });
  ['pointerup','pointercancel'].forEach(evt => zone.addEventListener(evt, () => {
    dragging = false;
    zone.classList.remove('grabbing');
  }));
}

zoneLayout.forEach((pos, i) => {
  const zone = document.createElement('div');
  zone.className = 'drop-zone';
  zone.style.left = pos.left;
  zone.style.top = pos.top;
  zone.innerHTML = `<button class="remove-btn" title="entfernen">✕</button>`;
  gifBoard.appendChild(zone);
  makeDraggable(zone);

  // auto-fill from dancing/1.gif .. dancing/4.gif, if present
  const autoSrc = `dancing/${i + 1}.gif`;
  const probe = new Image();
  probe.onload = () => setZoneImage(zone, autoSrc);
  probe.src = autoSrc;

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file && file.type.startsWith('image/')){
      const reader = new FileReader();
      reader.onload = ev => setZoneImage(zone, ev.target.result);
      reader.readAsDataURL(file);
      return;
    }
    const url = extractImageUrl(e.dataTransfer);
    if(url) setZoneImage(zone, url);
  });

  // click an empty zone to pick a file instead (in case native drag&drop isn't cooperating)
  zone.addEventListener('click', () => {
    if(zone.classList.contains('has-image')) return;
    activeZone = zone;
    filePicker.click();
  });

  zone.querySelector('.remove-btn').addEventListener('click', e => {
    e.stopPropagation();
    const img = zone.querySelector('img');
    if(img) img.remove();
    zone.classList.remove('has-image');
  });
});

filePicker.addEventListener('change', () => {
  const file = filePicker.files && filePicker.files[0];
  filePicker.value = '';
  if(!file || !activeZone) return;
  const reader = new FileReader();
  reader.onload = ev => setZoneImage(activeZone, ev.target.result);
  reader.readAsDataURL(file);
});

// don't let a dropped file navigate the whole page if it misses a zone
['dragover','drop'].forEach(evt => window.addEventListener(evt, e => e.preventDefault()));
</script>
</body>
</html>
